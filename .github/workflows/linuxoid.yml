name: Linuxoid build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew --no-daemon :linuxoid:testDebugUnitTest :linuxoid:assembleDebug :linuxoid:assembleRelease :linuxoid:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Linuxoid-apks-and-checks
          path: |
            linuxoid/build/outputs/apk/**/*.apk
            linuxoid/build/reports/tests/testDebugUnitTest/**
            linuxoid/build/reports/lint-results-debug.html
