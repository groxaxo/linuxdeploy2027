<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">linuxdeploy2027 — Your pocket. Your penguin. Your rules.</title>
  <desc id="desc">A mint, cyan and violet circuit grid connects a Linux terminal to an Android phone against a dark background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101729"/><stop offset="1" stop-color="#18102e"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#78f0b5"/><stop offset=".55" stop-color="#67d4ff"/><stop offset="1" stop-color="#b49aff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94b3da" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="480" rx="24" fill="url(#grid)"/>
  <path d="M0 440H730L786 358H1030M900 0V65L940 105H1280M0 70H80" fill="none" stroke="url(#accent)" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="730" cy="440" r="4" fill="#78f0b5"/><circle cx="940" cy="105" r="4" fill="#b49aff"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <rect x="64" y="56" width="228" height="30" rx="15" fill="#78f0b5" fill-opacity=".1" stroke="#78f0b5" stroke-opacity=".35"/>
    <circle cx="83" cy="71" r="4" fill="#78f0b5"/>
    <text x="98" y="76" font-size="12" letter-spacing="1.5" fill="#78f0b5">ROOTED AND READY</text>
    <text x="60" y="167" font-size="59" font-weight="800" letter-spacing="-3" fill="#f1f5ff">linuxdeploy<tspan fill="#78f0b5">2027</tspan></text>
    <text x="64" y="209" font-size="20" fill="#becbe3">Your pocket. Your penguin. Your rules.</text>
    <rect x="64" y="249" width="629" height="112" rx="12" fill="#090f1b" stroke="#33415d"/>
    <circle cx="83" cy="267" r="4" fill="#ff708d"/><circle cx="98" cy="267" r="4" fill="#ffd278"/><circle cx="113" cy="267" r="4" fill="#78f0b5"/>
    <text x="84" y="300" font-size="17" fill="#78f0b5">android# <tspan fill="#e4ebfa">chroot /path/to/linux /bin/bash</tspan></text>
    <text x="84" y="332" font-size="17" fill="#67d4ff">linux# <tspan fill="#e4ebfa">hello, userspace.</tspan><tspan fill="#78f0b5"> ▌</tspan></text>
    <text x="64" y="415" font-size="12" letter-spacing="2" fill="#9cacc7">GNU/LINUX · ANDROID · CHROOT · SSH · VNC</text>
  </g>
