    <circle cx="86" cy="111" r="4" fill="#111827"/><circle cx="138" cy="111" r="4" fill="#111827"/>
    <rect x="45" y="157" width="134" height="111" rx="13" fill="#090f1b" stroke="#67d4ff" stroke-opacity=".6"/>
