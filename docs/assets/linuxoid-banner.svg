<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Linuxoid — A little phone. A whole Linux world.</title><desc id="desc">A green terminal and minimal Ubuntu workspaces on a warm off-white canvas.</desc>
